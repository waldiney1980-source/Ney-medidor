<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>HidroLuz — Leitura de Energia e Água</title>
<meta name="description" content="Aplicativo de leitura de medidores de energia e água, com histórico por medidor e painel analítico.">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HidroLuz">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="app" class="app" hidden>

  <aside class="sidebar" aria-label="Navegação principal">
    <div class="sidebar__brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2.2c3.6 4.2 6.2 7.6 6.2 10.6a6.2 6.2 0 1 1-12.4 0C5.8 9.8 8.4 6.4 12 2.2Z" fill="currentColor" opacity=".22"/><path d="M12 2.2c3.6 4.2 6.2 7.6 6.2 10.6a6.2 6.2 0 1 1-12.4 0C5.8 9.8 8.4 6.4 12 2.2Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.9 8.6 9.6 13.4h2.2l-1 3.6 3.6-5.1h-2.3l.8-3.3Z" fill="currentColor"/></svg>
      </span>
      <span class="brand__text"><b>HidroLuz</b><small>Gestão de utilidades</small></span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__foot" id="sidebar-foot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="topbar__back icon-btn" id="btn-back" hidden aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar__titles">
        <h1 id="page-title">Painel</h1>
        <p id="page-sub"></p>
      </div>
      <div class="topbar__actions">
        <button class="sync-chip" id="sync-chip" title="Sincronizar agora">
          <span class="sync-chip__dot" id="sync-dot"></span>
          <span class="sync-chip__label" id="sync-label">Local</span>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>
</div>

<div id="splash" class="splash">
  <div class="splash__mark">
    <svg viewBox="0 0 24 24" width="46" height="46"><path d="M12 2.2c3.6 4.2 6.2 7.6 6.2 10.6a6.2 6.2 0 1 1-12.4 0C5.8 9.8 8.4 6.4 12 2.2Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12.9 8.6 9.6 13.4h2.2l-1 3.6 3.6-5.1h-2.3l.8-3.3Z" fill="currentColor"/></svg>
  </div>
  <p>Carregando…</p>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
